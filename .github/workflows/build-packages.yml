name: Build packages

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  # 先做静态校验，问题早暴露，不浪费打包时间
  validate:
    name: 静态校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell 语法检查
        run: |
          sh -n net/ieee8021xclient/files/ieee8021xclient.sh
          echo "shell 语法 OK"

      - name: LuCI 协议脚本语法检查
        run: |
          JS=luci-proto-ieee8021xclient/htdocs/luci-static/resources/protocol/ieee8021xclient.js
          # 协议文件顶层是 `return ...`（LuCI 会包进函数执行），需包一层再 check
          { echo '(function() {'; cat "$JS"; echo '})();'; } > /tmp/js_check.js
          node --check /tmp/js_check.js
          grep -q 'return network.registerProtocol' "$JS" \
            || { echo "!! 协议文件必须 return network.registerProtocol(...)"; exit 1; }



  # OpenWrt / ImmortalWrt 25.12+ 只接受 APKv3，必须用 Alpine 官方 apk-tools 生成
  apk-v3:
    name: APKv3（25.12+）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 用 Alpine 官方 apk-tools 打包
        run: |
          mkdir -p dist/apk-v3
          docker run --rm \
            -v "$PWD:/work" -w /work \
            alpine:edge \
            sh -c '
              set -e
              apk --version
              echo "---- mkpkg 选项 ----"
              apk mkpkg --help 2>&1 | sed -n "1,25p"

              W=/tmp/apkbuild
              rm -rf "$W"
              mkdir -p "$W/p1/lib/netifd/proto" \
                       "$W/p2/www/luci-static/resources/protocol"

              cp net/ieee8021xclient/files/ieee8021xclient.sh \
                 "$W/p1/lib/netifd/proto/ieee8021xclient.sh"
              chmod 755 "$W/p1/lib/netifd/proto/ieee8021xclient.sh"

              cp luci-proto-ieee8021xclient/htdocs/luci-static/resources/protocol/ieee8021xclient.js \
                 "$W/p2/www/luci-static/resources/protocol/ieee8021xclient.js"
              chmod 644 "$W/p2/www/luci-static/resources/protocol/ieee8021xclient.js"

              # Create post-install script to restart services
              echo "#!/bin/sh" > "$W/post-install.sh"
              echo "/etc/init.d/network restart" >> "$W/post-install.sh"
              echo "/etc/init.d/rpcd restart" >> "$W/post-install.sh"
              echo "exit 0" >> "$W/post-install.sh"
              chmod 755 "$W/post-install.sh"

              VER="${PKG_VERSION:-5}"
              REL="${PKG_RELEASE:-0}"

              apk mkpkg --files "$W/p1" \
                --info name:ieee8021xclient \
                --info "version:${VER}-r${REL}" \
                --info arch:noarch \
                --info "description:Wired 802.1x client config support in /etc/config/network" \
                --info license:GPL-2.0-or-later \
                --info origin:ieee8021xclient \
                --info "maintainer:David Yang <mmyangfl@gmail.com>" \
                --info url:https://github.com/openwrt/packages \
                --script "post-install:$W/post-install.sh" \
                --output "dist/apk-v3/ieee8021xclient-${VER}-r${REL}.apk"

              apk mkpkg --files "$W/p2" \
                --info name:luci-proto-ieee8021xclient \
                --info version:1-r0 \
                --info arch:noarch \
                --info "description:LuCI support for the wired IEEE 802.1X client protocol" \
                --info license:GPL-2.0-or-later \
                --info origin:luci-proto-ieee8021xclient \
                --info "maintainer:David Yang <mmyangfl@gmail.com>" \
                --info url:https://github.com/openwrt/packages \
                --info depends:ieee8021xclient \
                --script "post-install:$W/post-install.sh" \
                --output dist/apk-v3/luci-proto-ieee8021xclient-1-r0.apk
            '

      - name: 校验产物是 APKv3（文件头 ADB）
        run: |
          ls -l dist/apk-v3/
          for f in dist/apk-v3/*.apk; do
            magic=$(head -c 3 "$f")
            echo "$f -> magic=$magic"
            [ "$magic" = "ADB" ] || { echo "!! 不是 APKv3: $f"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: apk-v3
          path: dist/apk-v3/*.apk

  ipk:
    name: IPK（传统 OpenWrt）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 手动打包 IPK
        run: |
          mkdir -p dist/ipk
          VER="${PKG_VERSION:-5}"
          REL="${PKG_RELEASE:-0}"

          # 1. ieee8021xclient
          W=/tmp/ipk-ieee
          rm -rf "$W" && mkdir -p "$W/data/lib/netifd/proto" "$W/control"
          echo "2.0" > "$W/debian-binary"
          
          cp net/ieee8021xclient/files/ieee8021xclient.sh "$W/data/lib/netifd/proto/ieee8021xclient.sh"
          chmod 755 "$W/data/lib/netifd/proto/ieee8021xclient.sh"
          
          echo "Package: ieee8021xclient" > "$W/control/control"
          echo "Version: ${VER}-r${REL}" >> "$W/control/control"
          echo "Architecture: all" >> "$W/control/control"
          echo "Maintainer: David Yang <mmyangfl@gmail.com>" >> "$W/control/control"
          echo "Description: Wired 802.1x client config support in /etc/config/network" >> "$W/control/control"
          
          echo "#!/bin/sh" > "$W/control/postinst"
          echo "[ -n \"\${IPKG_INSTROOT}\" ] || {" >> "$W/control/postinst"
          echo "  /etc/init.d/network restart" >> "$W/control/postinst"
          echo "  /etc/init.d/rpcd restart" >> "$W/control/postinst"
          echo "}" >> "$W/control/postinst"
          echo "exit 0" >> "$W/control/postinst"
          chmod 755 "$W/control/postinst"
          
          (cd "$W/data" && tar -czf ../data.tar.gz .)
          (cd "$W/control" && tar -czf ../control.tar.gz .)
          (cd "$W" && tar -czf "ieee8021xclient_${VER}-r${REL}_all.ipk" debian-binary data.tar.gz control.tar.gz)
          cp "$W/ieee8021xclient_${VER}-r${REL}_all.ipk" dist/ipk/

          # 2. luci-proto-ieee8021xclient
          W=/tmp/ipk-luci
          rm -rf "$W" && mkdir -p "$W/data/www/luci-static/resources/protocol" "$W/control"
          echo "2.0" > "$W/debian-binary"
          
          cp luci-proto-ieee8021xclient/htdocs/luci-static/resources/protocol/ieee8021xclient.js "$W/data/www/luci-static/resources/protocol/ieee8021xclient.js"
          chmod 644 "$W/data/www/luci-static/resources/protocol/ieee8021xclient.js"
          
          echo "Package: luci-proto-ieee8021xclient" > "$W/control/control"
          echo "Version: 1-r0" >> "$W/control/control"
          echo "Depends: ieee8021xclient" >> "$W/control/control"
          echo "Architecture: all" >> "$W/control/control"
          echo "Maintainer: David Yang <mmyangfl@gmail.com>" >> "$W/control/control"
          echo "Description: LuCI support for the wired IEEE 802.1X client protocol" >> "$W/control/control"
          
          echo "#!/bin/sh" > "$W/control/postinst"
          echo "[ -n \"\${IPKG_INSTROOT}\" ] || {" >> "$W/control/postinst"
          echo "  /etc/init.d/network restart" >> "$W/control/postinst"
          echo "  /etc/init.d/rpcd restart" >> "$W/control/postinst"
          echo "}" >> "$W/control/postinst"
          echo "exit 0" >> "$W/control/postinst"
          chmod 755 "$W/control/postinst"
          
          (cd "$W/data" && tar -czf ../data.tar.gz .)
          (cd "$W/control" && tar -czf ../control.tar.gz .)
          (cd "$W" && tar -czf "luci-proto-ieee8021xclient_1-r0_all.ipk" debian-binary data.tar.gz control.tar.gz)
          cp "$W/luci-proto-ieee8021xclient_1-r0_all.ipk" dist/ipk/

      - uses: actions/upload-artifact@v4
        with:
          name: ipk
          path: dist/ipk/*.ipk

  # 打 tag 时把三类产物挂到 Release
  release:
    name: 发布
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ validate, apk-v3, ipk ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 附加到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
